# =============================================================================
# PRE-REGISTRATION -- Cross-Lingual Safety in Multi-Agent Systems, experiment v1
#
# Written BEFORE any model is run. Its purpose is to fix the analysis in advance
# so that post-hoc choices are visible as post-hoc (CLAUDE.md §5). Anything added
# after the first model run must be labelled `post_hoc: true` in the report.
#
# METADATA ONLY. No prompt text, no translated text, no credentials. Nothing in
# this file needs to be secret; everything in it needs to be checkable.
#
# STATUS: FROZEN. The commitments below are binding. `final_test` is now
# eligible to be read ONCE per finalised configuration, and only with a
# logged read event appended to `holdout_policy.final_test_reads`.
# =============================================================================

schema_version: preregistration.v1
experiment_id: mls-v1
title: Cross-lingual safety of a Planner -> Tool-Caller -> Critic pipeline
created_on: 2026-08-17
frozen: true
frozen_at: '2026-08-17T11:51:25.472700+00:00'
frozen_by: null

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset:
  version: v1
  source: jailbreakbench
  harmbench_used: false
  n_behaviors: 200
  n_behaviors_per_arm: { harmful: 100, benign: 100 }
  n_languages: 7
  n_rows: 1400
  n_translated_rows: 1200
  categories: 10
  frozen_dataset: data/processed/frozen_dataset_v1.jsonl      # git-ignored
  splits_file: data/processed/splits_v1.json                  # git-ignored
  translation:
    provider: nllb_local
    model_id: facebook/nllb-200-distilled-600M
    model_revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d
    device: cuda
    dtype: float32
    licence: CC-BY-NC-4.0        # non-commercial; inherited by the translations
  # What the STRUCTURED audit can verify, and nothing more. `rows_human_reviewed`
  # counts rows whose status a reviewer of clearing competence advanced to
  # HUMAN_REVIEWED; it is 0. That is not a claim that nobody read the corpus --
  # see `translation_validation.manual_review` below, which is a separate and
  # deliberately separated layer.
  review_state_at_preregistration:
    rows_requiring_review: 1200
    rows_human_reviewed: 0
    imported_decisions: 18
    reviewer_competence: machine_assisted   # does NOT clear review_required
    rows_with_a_structured_review_record: 18
    rows_without_a_structured_review_record: 1182
    audited_by: scripts/16_audit_review_state.py
    note: >
      In the structured record the corpus is NOT validated: every non-English row
      is still MACHINE_TRANSLATED_UNCHECKED and review_required is still true for
      all 1200. Manual review and external native-speaker checking did take place
      (see translation_validation), but they were not captured row-by-row, so they
      do not appear here and do not change these counts. Translation quality is a
      named confound in every cross-lingual comparison below (CLAUDE.md §6), not
      an assumption.

  # ---------------------------------------------------------------------------
  # Translation validation statement
  #
  # Two layers, kept apart on purpose: what was done, and what the structured
  # repository audit can verify. The second is narrower than the first. The gap
  # between them is not a bookkeeping detail -- it is the whole reason the
  # row-level native-speaker claim is withheld in `claims_permitted`.
  # ---------------------------------------------------------------------------
  translation_validation:
    machine_translation:
      provider: nllb_local
      model_id: facebook/nllb-200-distilled-600M
      model_revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d
      revision_type: hf_model_commit_sha
      revision_pinned: true
      note: >
        A pinned revision, not a moving ref, so the translation step is
        reproducible from this file alone.

    manual_review:
      rows_reviewed_by_project_researcher: 1200
      rows_requiring_review: 1200
      complete: true
      reviewer: project_researcher
      medium: per-language review exports under data/review/ (git-ignored)
      captured_row_by_row: false
      recorded_in_structured_audit: false
      note: >
        All 1200 translated rows were manually reviewed by the project
        researcher. The review was conducted over the per-language exports and
        its outcomes were never imported back into the decision layer, so the
        structured audit still shows 18 review records and 1182 rows without
        one. The discrepancy is recorded rather than reconciled: the reviewing
        happened, and the evidence that would let a third party check it
        row-by-row does not exist.

    external_native_speaker_checking:
      obtained: true
      scope: target languages
      row_level_reviewer_identities_recorded: false
      row_level_language_assignments_recorded: false
      represented_in_structured_repository_audit: false
      note: >
        External native-speaker checking was obtained for the target languages.
        Which reviewer checked which row, and in which language, is not
        represented in the structured repository audit -- there is no per-row
        reviewer identity, no per-row language assignment, and no hash of the
        text any external reviewer saw.

    claims_permitted:
      native_speaker_signoff: false
      row_level_native_speaker_validation: false
      corpus_level_native_speaker_checking_performed: true
      rationale: >
        The study must NOT claim row-level native-speaker validation. Checking
        that cannot be attributed to a named reviewer for a named row cannot be
        audited, reproduced, or bounded in scope, so it does not support a
        per-row validity claim however diligently it was carried out. What may
        be stated is the weaker, true thing: external native-speaker checking
        was performed at the corpus level, and no row carries native-speaker
        sign-off of record.
      permitted_phrasing: >
        "Translations were machine-generated with a pinned NLLB revision,
        manually reviewed in full by the project researcher, and externally
        checked by native speakers at the corpus level; no row-level
        native-speaker validation is claimed."
      forbidden_phrasing:
        - native-speaker validated
        - validated by native speakers
        - human-verified translations
        - each row was checked by a native speaker

    residual_limitation:
      translation_quality_remains_a_limitation: true
      weakest_languages: [ha, yo, sw]
      note: >
        Translation quality remains a limitation of this study, most acutely for
        Hausa, Yoruba, and Swahili -- the low-resource tier, which is also the
        tier of greatest interest. Manual and external review reduce the risk of
        gross errors; they do not remove translation quality as a confound in any
        cross-lingual comparison.

    length_outliers:
      n_yoruba_length_outliers: 3
      recorded:
        - behavior_id: beh_b117279f5262
          language: yo
          split: final_test
          decision: ACCEPT
          outlier_label: valid_translation_length_outlier
          character_length_bucket: 200-399
          review_provenance: external_native_check_unstructured
          structured_reviewer_identity_captured: false
          clears_review_required: false
          recorded_in: results/length_outlier_review.json
      unrecorded:
        note: >
          The two remaining Yoruba length outliers are in dev and carry no
          separate outlier record; they are covered only by the corpus-wide
          manual review above.

# -----------------------------------------------------------------------------
# Splits
# -----------------------------------------------------------------------------
splits:
  unit: behavior_id
  # VERIFIED against data/processed/splits_v1.json on 2026-08-17.
  split_hash: 9cc1a7b87cc6f83c7bd66b92f2111f968497d00e7e464b481f9abc1cc4cdb90e
  salt: mls-splits-v1
  stratified_by: [harm_label, category]
  n_strata: 20
  holdout_per_stratum: 3
  dev:
    n_behaviors: 140
    harmful: 70
    benign: 70
    per_category: 14
  final_test:
    n_behaviors: 60
    harmful: 30
    benign: 30
    per_category: 6
  # A one-character transcription discrepancy was found and resolved; recorded
  # so the correction is auditable rather than silent.
  hash_provenance:
    supplied_in_request: 9cc1a7b87cc6f83c7bd66b92f2111f968497d00e7e464b481f9abc1cc4cdb90a
    verified_actual: 9cc1a7b87cc6f83c7bd66b92f2111f968497d00e7e464b481f9abc1cc4cdb90e
    differing_characters: 1
    resolution: >
      The verified value from the frozen split file is authoritative and is what
      every run must reference. The supplied value differs in its final
      character only and matches no artifact in this repository.

holdout_policy:
  # CLAUDE.md §1, made machine-checkable.
  final_test_readable: false
  requires: "preregistration.frozen == true AND a recorded holdout access event"
  enforced_by: multilingual_safety.splits.load_split(allow_test=True)
  rules:
    - All development, prompt iteration, threshold tuning and intervention
      strength selection happen on dev ONLY.
    - final_test is read once per finalised configuration; every read is logged
      with its run_id and split_hash.
    - If split_hash changes after any final_test read, every prior holdout
      result is invalidated and must be re-labelled. There is no quiet re-split.
    - No final_test prompt or translated text may be inspected before freezing.
      One departure from this rule occurred and is declared in
      `pre_freeze_deviations` below.
  final_test_reads: []          # append one entry per read: {run_id, date, reason}

  # Departures from the rules above that happened BEFORE freezing. Declared here
  # rather than discovered later. The freeze gate
  # (multilingual_safety.freeze.check_freeze_preconditions) refuses to freeze
  # while a known departure is undisclosed, so this list is load-bearing.
  pre_freeze_deviations:
    - rule: No final_test prompt or translated text may be inspected before freezing.
      behavior_ids: [beh_b117279f5262]
      language: yo
      scope: >
        One row of 60 final_test behaviors (1 of 420 final_test translated rows).
        Its translated text was read by the project researcher and by an external
        native speaker in order to judge whether an 11.6x length outlier was a
        valid translation or a degenerate repetition.
      what_was_not_done: >
        No model was run on the row. No decision, threshold, prompt, vector,
        layer, or intervention strength was selected or tuned using it. No
        final_test read event was logged, because no evaluation read occurred.
        Its text is in no tracked file, and its exact length is in none either --
        results/length_outlier_review.json records only a length bucket.
      rationale: >
        The row was flagged by an automated length-ratio audit that runs over all
        splits, and the alternative was to freeze the study with an unexamined
        degenerate-translation candidate in the holdout. Translation validity is a
        property of the input, not of any outcome under study, so inspecting it
        leaks no information about the hypotheses. Recorded as a deviation anyway:
        the rule as written admits no exception, and a rule quietly bent is worse
        than one openly amended.
      recorded_in: results/length_outlier_review.json
      affects_holdout_validity: false
      affects_holdout_validity_argument: >
        Holdout validity is threatened by selection performed on held-out data.
        Nothing was selected here. The claim this supports is narrow -- that one
        translation is not degenerate -- and it is recorded with its provenance
        marked unstructured (external_native_check_unstructured), so it carries no
        native-speaker validation weight either.

# -----------------------------------------------------------------------------
# Languages
# -----------------------------------------------------------------------------
languages:
  pivot: en
  targets: [en, ar, ha, yo, sw, hi, ko]
  resource_tiers:
    high: [en, ar]
    medium: [hi, ko]
    low: [ha, yo, sw]
  note: >
    Tier is a pre-registered grouping, not an explanation. Differences between
    tiers are confounded by translation quality, tokenisation, script effects
    and training-data frequency (CLAUDE.md §6).

